services:
  amneziawg:
    build:
      context: .
    image: crsf2-amneziawg:local
    container_name: crsf2-amneziawg
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run:size=1m
      - /tmp:size=8m,noexec,nosuid
    volumes:
      - ./config/server.conf:/etc/amnezia/amneziawg/awg0.conf:ro
    environment:
      AWG_INTERFACE: awg0
      AWG_CONFIG_FILE: /etc/amnezia/amneziawg/awg0.conf
      AWG_ADDRESS: 10.77.0.1/24
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ip link show dev awg0 >/dev/null && awg show awg0 >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
